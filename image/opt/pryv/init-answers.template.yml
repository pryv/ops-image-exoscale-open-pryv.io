# Answers given to the open-pryv.io install wizard (`init --non-interactive`)
# at first boot. /opt/pryv/first-boot.sh renders this file into
# /opt/pryv/init-answers.yml from /opt/pryv/first-boot.env.
#
# Every secret is generated by the wizard itself (secrets.autogenerate) and
# ends up in /opt/pryv/pryv-config.yml: none is ever taken from user-data.
dnsless: true
publicurl: 'https://${PRYV_HOSTNAME}'
db.engine: sqlite
service.name: '${PRYV_SERVICE_NAME}'
secrets.autogenerate: true
authui.url: '${PRYV_AUTHUI_URL}'
tls.strategy: letsEncrypt
le.email: '${PRYV_EMAIL}'
# The wizard defaults to the Let's Encrypt staging CA: production unless
# PRYV_LE_STAGING=true is set (test launches only).
le.staging: ${PRYV_LE_STAGING}
hfs.enabled: false
email.enabled: false
